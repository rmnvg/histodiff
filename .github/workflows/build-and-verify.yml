name: Build and verify distribution artifacts

# Reusable workflow: builds the wheel and sdist, runs every check described
# in scripts/verify_dist.py and scripts/smoke_test_install.sh, and uploads
# the result as the "dist" artifact. Called as a job from ci.yml (on every
# push/PR) and from release-testpypi.yml/release.yml (before publishing),
# so CI and the release workflows always run this exact same definition -
# not a copy that can drift out of sync with what actually gets published.
#
# workflow_call only: this file intentionally has no push/pull_request
# trigger of its own, so it never runs on its own in addition to the caller.

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Verify the built artifacts
        run: python scripts/verify_dist.py
      - name: Install and test the wheel outside the source tree
        run: bash scripts/smoke_test_install.sh dist/*.whl
      - name: Install and test the source distribution outside the source tree
        run: bash scripts/smoke_test_install.sh dist/*.tar.gz
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # Reads __version__ out of the source file rather than importing
        # histodiff, since this job never installs the package into its own
        # environment (verify_dist.py and smoke_test_install.sh each use
        # their own throwaway venvs instead, on purpose).
        run: |
          python -c "
          import os, pathlib, re
          text = pathlib.Path('src/histodiff/__init__.py').read_text()
          match = re.search(r'__version__\s*=\s*\"([^\"]+)\"', text)
          assert match, 'could not find __version__ in src/histodiff/__init__.py'
          version = match.group(1)
          tag = os.environ['RELEASE_TAG']
          assert tag == f'v{version}', f'tag {tag!r} does not match __version__ {version!r}'
          print(f'OK: tag {tag!r} matches __version__ {version!r}')
          "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
