name: CI

on:
  push:
  pull_request:

# Default for every job below; jobs that need more (none do here - the
# release workflows are separate) declare it themselves rather than
# widening this.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Coverage
        run: pytest --cov --cov-branch --cov-report=term-missing

  build:
    # Delegates to the reusable workflow that also backs the release
    # workflows (release-testpypi.yml, release.yml), so CI builds and
    # verifies exactly the same artifact a release would publish - not a
    # separate copy of similar-looking steps that could drift out of sync.
    uses: ./.github/workflows/build-and-verify.yml
    permissions:
      contents: read

  test:
    # Likewise shared with the release workflows - see test-suite.yml.
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read
