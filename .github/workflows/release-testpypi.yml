name: Publish to TestPyPI

# Manual only, for trying out a release (including a release candidate
# version, or re-testing packaging changes) before it goes to real PyPI.
# Publishes whatever commit you run it against - check out the ref you mean
# to test first, e.g. from the "Run workflow" dropdown's "Use workflow from"
# branch/tag picker.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-and-verify.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    # This environment (Settings > Environments > testpypi) is configured
    # with a required reviewer, so a manual trigger still gets a second pair
    # of eyes before anything is uploaded. It's also where TestPyPI's
    # trusted-publisher configuration expects this job to run *as* - see the
    # comment on the publish step below.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/histodiff/
    permissions:
      # id-token: write is what lets gh-action-pypi-publish get a short-lived
      # OIDC token instead of a long-lived API token stored as a secret -
      # see https://docs.pypi.org/trusted-publishers/.
      id-token: write
      # For actions/attest-build-provenance - see
      # https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Requires a trusted publisher to be configured for this project on
      # TestPyPI first (test.pypi.org > your project > Publishing), pointing
      # at this repository, this workflow file, and the "testpypi"
      # environment above. See https://docs.pypi.org/trusted-publishers/
      # for first-time setup; for a project that has never been published,
      # register it as a *pending* trusted publisher before running this.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
