name: Test suite

# Reusable workflow: the full test matrix (every supported Python version on
# Linux, plus macOS and Windows), the examples, and the CLI/Git smoke tests.
# Called as a job from ci.yml (on every push/PR) and from the release
# workflows (release-testpypi.yml, release.yml), where it's a required gate
# before anything is published - a release with a red test suite can't reach
# the publish job, on the same exact job definition CI itself runs, not a
# separate, potentially-drifted copy.
#
# workflow_call only: this file intentionally has no push/pull_request
# trigger of its own, so it never runs on its own in addition to the caller.

on:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Before/after example
        run: python examples/before_after.py
      - name: Benchmark smoke test
        run: python benchmarks/bench.py --quick
      - name: Real-world corpus example
        run: python examples/real_world_corpus.py --quick
      - name: CLI smoke test
        shell: bash
        run: |
          set +e
          histodiff examples/frobnitz_old.c examples/frobnitz_new.c
          status=$?
          set -e
          test "$status" -eq 1
      - name: Git integration smoke test
        shell: bash
        # tests/test_git.py already covers this in depth (including via a
        # real `git` subprocess); this is a short, independent check of the
        # documented `git diff` workflow specifically, visible as its own
        # step rather than folded into the general test run above.
        run: |
          set -e
          tmp="${RUNNER_TEMP}/git-smoke"
          rm -rf "$tmp" && mkdir -p "$tmp" && cd "$tmp"
          git init -q
          git config user.name "CI"
          git config user.email "ci@example.invalid"
          git config diff.external git-histodiff
          printf 'one\ntwo\nthree\n' > sample.py
          git add sample.py
          git commit -qm "initial"
          printf 'one\nTWO\nthree\n' > sample.py
          output="$(git diff -- sample.py)"
          echo "$output"
          echo "$output" | grep -q "diff --histodiff a/sample.py b/sample.py"
          echo "$output" | grep -q -- "-two"
          echo "$output" | grep -q -- "+TWO"
